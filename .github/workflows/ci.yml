name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code quality checks
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install black flake8 isort mypy
      
      - name: Check code formatting (black)
        run: black --check src/ tests/ scripts/
      
      - name: Check import sorting (isort)
        run: isort --check-only src/ tests/ scripts/
      
      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
          pip install -e .
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Integration tests (only on main branches)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout
          pip install -e .
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --timeout=300

  # Build Docker image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build base image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: base
          push: false
          tags: distributed-llm-platform:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build dev image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: dev
          push: false
          tags: distributed-llm-platform:dev
      
      - name: Build prod image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: prod
          push: false
          tags: distributed-llm-platform:prod

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Documentation build check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
      
      - name: Validate README
        run: |
          [ -f README.md ] && echo "✓ README.md exists"
          [ -f docs/ARCHITECTURE.md ] && echo "✓ ARCHITECTURE.md exists"
          [ -f docs/guides/LEARNING_GUIDE.md ] && echo "✓ LEARNING_GUIDE.md exists"
