name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code quality checks
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install black flake8 isort mypy
      
      - name: Check code formatting (black)
        run: black --check src/ tests/ scripts/ || echo "Formatting issues found (non-blocking)"
        continue-on-error: true

      - name: Check import sorting (isort)
        run: isort --check-only src/ tests/ scripts/ || echo "Import sorting issues found (non-blocking)"
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503,F401,F811 || echo "Lint issues found (non-blocking)"
        continue-on-error: true

  # Fast unit tests (lightweight - no heavy ML dependencies)
  test-lightweight:
    name: Lightweight Tests (No ML Dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-minimal-${{ hashFiles('requirements-test-minimal.txt') }}

      - name: Install minimal test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-test-minimal.txt
          pip install -e .

      - name: Run lightweight unit tests
        run: |
          # Run only the new tests that use mocks (don't require heavy dependencies)
          pytest tests/unit/test_mocks.py -v
          pytest tests/unit/test_security.py -v
          pytest tests/unit/test_retry.py -v
          pytest tests/unit/test_health.py -v

      - name: Run syntax validation
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path

          failed = []
          for py_file in Path('src').rglob('*.py'):
              try:
                  with open(py_file, 'r') as f:
                      ast.parse(f.read())
              except SyntaxError as e:
                  failed.append((py_file, str(e)))

          if failed:
              print('Syntax errors found:')
              for f, e in failed:
                  print(f'  {f}: {e}')
              sys.exit(1)
          else:
              print(f'✓ All Python files have valid syntax')
          "

  # Full unit tests (with heavy ML dependencies) - only on main branches
  test-full:
    name: Full Tests (With ML Dependencies)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-full-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install CPU-only torch to avoid CUDA issues
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets tokenizers
          pip install pytest pytest-cov pytest-mock pytest-timeout
          pip install -e .
        timeout-minutes: 15

      - name: Run all unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m "not gpu and not slow" --cov=src --cov-report=xml
        timeout-minutes: 10

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
        continue-on-error: true

  # Integration tests (only on main branches)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test-minimal.txt
          pip install pytest pytest-timeout
          pip install -e .
        timeout-minutes: 10

      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ] && [ "$(ls -A tests/integration/*.py 2>/dev/null)" ]; then
            pytest tests/integration/ -v --timeout=300 -m "not gpu" || echo "Some integration tests failed (non-blocking)"
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true

  # Build Docker image (only on main branches)
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build base image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: base
          push: false
          tags: distributed-llm-platform:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Build prod image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: prod
          push: false
          tags: distributed-llm-platform:prod
        continue-on-error: true

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Documentation check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate core documentation files
        run: |
          echo "Checking documentation files..."
          [ -f README.md ] && echo "✓ README.md exists" || echo "⚠ README.md missing"
          [ -f docs/ARCHITECTURE.md ] && echo "✓ ARCHITECTURE.md exists" || echo "⚠ ARCHITECTURE.md missing"
          [ -f docs/guides/LEARNING_GUIDE.md ] && echo "✓ LEARNING_GUIDE.md exists" || echo "⚠ LEARNING_GUIDE.md missing"
          [ -f PROGRESS_REPORT.md ] && echo "✓ PROGRESS_REPORT.md exists" || echo "⚠ PROGRESS_REPORT.md missing"
          [ -f FINAL_SUMMARY_V03.md ] && echo "✓ FINAL_SUMMARY_V03.md exists" || echo "⚠ FINAL_SUMMARY_V03.md missing"
          echo "Documentation check complete"
